<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>// MATRIX_SERVERLESS_SHARE // v4.0</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(15, 22, 28, 0.9);
            --accent-color: #00ff66;
            --text-color: #d1ffd6;
            --border-color: #00ff66;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-color);
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin: 0;
        }

        .container {
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            backdrop-filter: blur(5px);
        }

        .upload-box {
            border: 2px dashed rgba(0, 255, 102, 0.5);
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
            background: rgba(0, 0, 0, 0.4);
        }

        .upload-box:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background-color: #000;
            color: var(--accent-color);
            border: 2px solid var(--border-color);
            padding: 12px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 15px;
            width: 100%;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: var(--accent-color);
            color: #000;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .result-box {
            margin-top: 25px;
            display: none;
        }

        .link-output {
            background-color: #000;
            padding: 12px;
            border: 1px solid var(--border-color);
            color: #fff;
            word-break: break-all;
            font-size: 0.8rem;
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .preview-window {
            margin-top: 20px;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .preview-header {
            background-color: #111;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .dots { display: flex; gap: 6px; margin-right: 15px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--accent-color); }
        .preview-title { font-size: 0.8rem; color: var(--accent-color); }

        .preview-body {
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .preview-body img, .preview-body video {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .preview-body audio { width: 100%; }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <header>
        <h1>[ MATRIX_SERVERLESS_V4 ]</h1>
        <p style="color: #a3ffa3; margin: 5px 0 0 0;">// Local Encryption & Peer Sharing Protocol</p>
    </header>

    <div class="container">
        <!-- Файл енгізу блогы -->
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <span style="color: var(--accent-color);" id="uploadText">> INITIALIZE_LOCAL_ENCRYPTION_</span>
            <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Ұсынылады: Кішігірім суреттер, аудио, видео</p>
        </div>
        
        <input type="file" id="fileInput" accept="image/*, audio/*, video/*" onchange="fileSelected()">
        <button class="btn" onclick="generateSecureLink()">execute compile_link.sh</button>

        <!-- Нәтиже бөлімі -->
        <div class="result-box" id="resultBox">
            <p style="color: var(--accent-color);" id="statusText">✔ LINK COMPILED SUCCESSFULLY</p>
            
            <div class="link-output" id="linkOutput"></div>
            <button class="btn" onclick="copyLink()">copy_to_clipboard()</button>

            <div class="preview-window">
                <div class="preview-header">
                    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    <div class="preview-title" id="previewTitle">output_preview.log</div>
                </div>
                <div class="preview-body" id="previewBody"></div>
            </div>
        </div>
    </div>

    <script>
        // --- МАТРИЦА ФОН ЭФФЕКТІСІ ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const alphabet = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ1234567890ABCDEF'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        const drawMatrix = () => {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        };
        setInterval(drawMatrix, 30);

        // --- СЕРВЕРСІЗ СІЛТЕМЕ ЖАСАУ ЛОГИКАСЫ ---
        function fileSelected() {
            const fileInput = document.getElementById('fileInput');
            const uploadText = document.getElementById('uploadText');
            if (fileInput.files.length > 0) {
                uploadText.innerText = `[ READY: ${fileInput.files[0].name} ]`;
                uploadText.style.color = "#fff";
            }
        }

        function generateSecureLink() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Қате: Алдымен файлды таңдаңыз!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader(); // Файлды кодқа айналдыру құралы

            const resultBox = document.getElementById('resultBox');
            const linkOutput = document.getElementById('linkOutput');
            const statusText = document.getElementById('statusText');

            statusText.innerText = "⚡ COMPILING DATA PATTERNS...";
            statusText.style.color = "yellow";
            resultBox.style.display = "block";

            reader.onload = function(e) {
                const base64Data = e.target.result; // Файл толық кодқа айналды
                
                // Сайттың қазіргі мекенжайын алып, соңына файл кодын хэш (#) арқылы жалғаймыз
                const currentUrl = window.location.href.split('#')[0];
                const finalShareableLink = currentUrl + '#' + encodeURIComponent(base64Data);

                // Экранға шығару
                statusText.innerText = "✔ LINK COMPILED & ENCRYPTED";
                statusText.style.color = "var(--accent-color)";
                linkOutput.innerText = finalShareableLink;

                // Алдын ала көру (Превью)
                showPreview(file.type, base64Data);
            };

            reader.readAsDataURL(file); // Файлды оқуды бастау
        }

        function showPreview(fileType, url) {
            const previewBody = document.getElementById('previewBody');
            const previewTitle = document.getElementById('previewTitle');
            previewBody.innerHTML = ""; 

            if (fileType.startsWith('image/')) {
                previewTitle.innerText = "render_image.obj";
                previewBody.innerHTML = `<img src="${url}" alt="Matrix Preview">`;
            } 
            else if (fileType.startsWith('audio/')) {
                previewTitle.innerText = "decode_audio.wav";
                previewBody.innerHTML = `<audio controls src="${url}"></audio>`;
            } 
            else if (fileType.startsWith('video/')) {
                previewTitle.innerText = "stream_core.mkv";
                previewBody.innerHTML = `<video controls src="${url}"></video>`;
            }
        }

        // СІЛТЕМЕНІ АВТОМАТТЫ ТҮРДЕ ОҚУ (Егер біреу сілтеме арқылы кірсе)
        window.onload = function() {
            if (window.location.hash) {
                try {
